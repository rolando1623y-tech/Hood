name: PanaHoops FIT - compilar APK de prueba
"on":
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: PanaHoops-Courtside
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar paquetes SDK fijados
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Pruebas unitarias y compilación nativa
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verificar paquete, versión, certificado y SHA-256
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.panahoops.courtside' versionCode='311'"
          sha256sum "$APK" > APK-SHA256.txt
      - name: Publicar artefacto de prueba
        uses: actions/upload-artifact@v4
        with:
          name: PanaHoops-FIT-debug-APK
          path: |
            PanaHoops-Courtside/app/build/outputs/apk/debug/app-debug.apk
            PanaHoops-Courtside/APK-SHA256.txt
          if-no-files-found: error